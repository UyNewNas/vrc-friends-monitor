name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?)$') { throw 'Invalid release tag.' }
          $tagVersion = $Matches.version
          [xml]$project = Get-Content 'src/VRCFriendsMonitor/VRCFriendsMonitor.csproj' -Raw
          if ($tagVersion -ne [string]$project.Project.PropertyGroup.Version) { throw 'Tag must match the project Version.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be part of main.' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vrc-friends-monitor-win-x64
          path: release-assets
      - name: Verify checksums and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File)
          $zip = @($assets | Where-Object Extension -eq '.zip')
          if ($assets.Count -ne 2 -or $zip.Count -ne 1) { throw 'Unexpected release assets.' }
          $expectedName = "VRC-Friends-Monitor-$($env:RELEASE_TAG.Substring(1))-win-x64.zip"
          if ($zip[0].Name -ne $expectedName) { throw 'Package version does not match release.' }
          $checksum = Get-Content -LiteralPath ($zip[0].FullName + '.sha256') -Raw
          $hash = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum.Trim() -ne "$hash  $expectedName") { throw 'Package checksum mismatch.' }
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'--verify-tag','--title',"VRC Friends Monitor $env:RELEASE_TAG",'--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          else { $releaseArgs += '--latest' }
          $releaseArgs += @($assets.FullName)
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $publishedJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release was not found.' }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.isDraft -or $published.tagName -ne $env:RELEASE_TAG -or @($published.assets).Count -ne 2) { throw 'Published release is incomplete.' }
          $names = @($published.assets.name | Sort-Object)
          $expected = @($expectedName, ($expectedName + '.sha256') | Sort-Object)
          if (Compare-Object $names $expected) { throw 'Published assets do not match the verified package.' }
