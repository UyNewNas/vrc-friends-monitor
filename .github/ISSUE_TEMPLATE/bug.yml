name: Bug report / 问题反馈
description: Report a reproducible problem without sharing account data.
body:
  - type: markdown
    attributes:
      value: 请勿上传密码、验证码、Cookie、session.bin、settings.json 或未脱敏的好友日志。截图请遮挡好友名字和 ID。
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: v1.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 x64
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期行为和实际行为
    validations:
      required: true
